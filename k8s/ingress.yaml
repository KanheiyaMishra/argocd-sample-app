apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  name: sample-app-ingress
  namespace: argocd-sample-app
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: sample.local
    http:
      paths:
      - path: /
        backend:
          serviceName: sample-app
          servicePort: 80
