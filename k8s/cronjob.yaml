apiVersion: batch/v1
kind: CronJob
metadata:
  name: sample-cronjob
  namespace: sample-app-argocd
spec:
  schedule: "*/1 * * * *"   # every minute
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: hello
            image: busybox
            args:
            - /bin/sh
            - -c
            - date; echo "Hello from Argo CD CronJob!"
          restartPolicy: OnFailure
